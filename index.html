<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/output.css" />
    <script src="./script.js" defer></script>
    <title>Document</title>
  </head>
  <body class="bg-black min-h-screen">
    <header class="sticky top-0 z-10">
      <nav
        class="top-0 w-full flex items-center justify-between p-4 bg-sky-500 text-white text-2xl"
      >
        <section class="font-bold text-white">
          <h1>ShopEase</h1>
        </section>
        <section>
          <button class="relative bg-sky-900 p-2 rounded-md" id="toggle-cart">
            Cart
          </button>
          <span
            id="product-count"
            class="bg-red-500 rounded-md w-5 h-5 text-sm flex items-center justify-center absolute right-15 top-2"
            >0</span
          >
        </section>
      </nav>
    </header>

    <article class="container mx-auto relative">
      <section class="text-white my-4 px-5">
        <h1 class="font-bold text-4xl">Our Product</h1>
        <p class="text-xl font-medium">
          Find the best products at great prices.
        </p>
      </section>

      <section
        class="p-5 grid grid-cols-1 grid-rows-6 xl:grid-cols-3 xl:grid-rows-2 lg:grid-cols-3 lg:grid-rows-2 md:grid-cols-2 md:grid-rows-4 sm:grid-cols-1 sm:grid-rows-6 gap-5 text-white"
        id="products-lists"
      ></section>

      <section
        class="fixed w-96 max-h-410 hidden bg-gray-900 p-4 text-white right-0 top-20 toggle-container"
      >
        <section class="flex justify-between items-center p-2 text-xl">
          <h1 class="font-bold">Shopping Cart</h1>
          <button
            class="outline-red-500 border border-red-500 cursor-pointer hover:bg-red-500 hover:text-white transition-colors text-red-500 p-2 rounded-md"
            id="product-clear"
          >
            Clear All
          </button>
        </section>

        <section class="flex flex-col max-h-90 overflow-y-auto p-4">
          <section
            class="grid grid-cols-1 grid-rows-1 gap-2"
            id="product-cart"
          ></section>
        </section>

        <section class="flex justify-between mt-5 font-md">
          <h1>Total</h1>
          <h1 id="total-cart">$0.00</h1>
        </section>

        <section class="w-full">
          <button class="w-full bg-sky-400 p-3 mt-5 rounded-md">
            Proceed to checkout
          </button>
        </section>
      </section>
    </article>
  </body>
</html>
